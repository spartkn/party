<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوة حفل</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden;
 font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#2b1d12;
 background:linear-gradient(120deg,#fbf1dc,#f7dfc2,#f3d3d0,#fbf1dc);background-size:300% 300%;animation:bgmove 14s ease infinite}
@keyframes bgmove{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}

/* خلفية عائمة */
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bg span{position:absolute;bottom:-60px;animation:float linear infinite;opacity:.8}
@keyframes float{to{transform:translateY(-115vh) rotate(25deg)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:5}

.card{position:relative;z-index:1;width:100%;max-width:440px;background:#fffaf0;border:2px solid #c99a3b;border-radius:22px;padding:34px 24px;text-align:center;
 box-shadow:0 14px 40px rgba(90,50,10,.2);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(40px)}}
.page{display:none}
.page.on{display:block}
.page.on>*{animation:rise .7s cubic-bezier(.2,.9,.3,1) both}
.page.on>*:nth-child(2){animation-delay:.25s}.page.on>*:nth-child(3){animation-delay:.5s}
.page.on>*:nth-child(4){animation-delay:.8s}.page.on>*:nth-child(5){animation-delay:1.1s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}

h1{font-size:1.5rem;line-height:1.7;margin:0 0 10px}
.big{display:inline-block;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-10px) rotate(-12deg)}60%{transform:translateY(0) rotate(8deg)}}
p{margin:0 0 20px;font-size:1.05rem;line-height:1.8}
.btns{display:flex;gap:12px}
button{flex:1;font:inherit;font-size:1.1rem;font-weight:700;padding:14px;border-radius:12px;border:0;cursor:pointer;transition:transform .15s,box-shadow .2s}
button:hover{transform:translateY(-3px)}button:active{transform:scale(.95)}
.yes{background:#1f7a4d;color:#fff;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(31,122,77,.55)}50%{box-shadow:0 0 0 12px rgba(31,122,77,0)}}
.no{background:#fff;color:#8a2f25;border:2px solid #8a2f25}
.main{background:#1f7a4d;color:#fff;width:100%}
input{width:100%;font:inherit;font-size:1.1rem;padding:14px;border:2px solid #d9c391;border-radius:12px;text-align:center;margin-bottom:12px;background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#c99a3b;box-shadow:0 0 0 4px rgba(201,154,59,.25);outline:0}
button:focus-visible{outline:3px solid #c99a3b}
.err{color:#a3261d;min-height:1.5em;margin-bottom:8px;font-size:.95rem}
.err.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.sad{font-size:3.4rem;display:inline-block;animation:droop 2.4s ease-in-out infinite}
@keyframes droop{50%{transform:translateY(8px) rotate(-8deg)}}
.sorry{font-size:1.4rem;color:#8a2f25}

.welcome{font-size:1.6rem;line-height:1.8;margin-bottom:6px}
.welcome .em{display:inline-block;animation:heart 1.1s ease-in-out infinite}
@keyframes heart{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.name{font-size:1.25rem;font-weight:700;margin-bottom:10px}
.ai{min-height:3.2em;font-size:1rem;line-height:1.8;color:#6b4d1d;margin-bottom:14px}
.ai.load{background:linear-gradient(90deg,#f0e3c4 25%,#fff6dc 50%,#f0e3c4 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:10px;color:transparent}
@keyframes shimmer{to{background-position:-200% 0}}
.ai small{display:block;font-size:.78rem;color:#a58a55;margin-top:2px}
.ticket{position:relative;background:#fff;border-radius:12px;padding:10px;border:1px dashed #c99a3b;overflow:hidden}
.ticket svg{max-width:100%;height:auto;display:block;margin:auto}
.ticket.go svg{animation:reveal 1.1s ease-out both}
@keyframes reveal{from{clip-path:inset(0 50% 0 50%);opacity:.2}to{clip-path:inset(0);opacity:1}}
.ticket i{position:absolute;top:0;bottom:0;width:3px;left:0;background:#e0452f;box-shadow:0 0 14px #e0452f;opacity:0}
.ticket.go i{animation:sweep 1.4s ease-in-out .2s 2}
@keyframes sweep{0%{left:0;opacity:1}100%{left:calc(100% - 3px);opacity:1}}
.hint{font-size:.88rem;color:#7a6a55;margin-top:12px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<canvas id="cf" aria-hidden="true"></canvas>

<div class="card">

  <div class="page on" id="p1">
    <h1>ندعوكم لحضور حفلنا <span class="big">🎉</span></h1>
    <p>الرجاء الإجابة بـ «نعم» إذا أردت الحضور، أو «لا» لعدم الحضور.</p>
    <div class="btns">
      <button class="yes" id="yes">نعم</button>
      <button class="no" id="no">لا</button>
    </div>
  </div>

  <div class="page" id="pNo">
    <div class="sad">😢</div>
    <h1 class="sorry">نأسف لعدم حضورك</h1>
    <button class="no" id="back" style="width:100%">رجوع</button>
  </div>

  <div class="page" id="p2">
    <h1>ضع اسمك الثلاثي</h1>
    <input id="nm" type="text" placeholder="مثال: علي محمد أحمد" maxlength="60" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="main" id="ok">متابعة</button>
  </div>

  <div class="page" id="p3">
    <div class="welcome">نتشرف بحضورك <span class="em">😍😘</span></div>
    <div class="name" id="shown"></div>
    <div class="ai load" id="ai">.</div>
    <div class="ticket" id="tk"><svg id="bc"></svg><i></i></div>
    <button class="main" id="dl" style="margin-top:14px">حفظ الباركود كصورة</button>
  </div>

</div>

<script>
// ⚠️ يجب أن يطابق المفتاح في تطبيق الفحص تمامًا
const SECRET = "party-cf7a456b561f855c";

const $ = id => document.getElementById(id);
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const show = id => { document.querySelectorAll(".page").forEach(p => p.classList.remove("on")); $(id).classList.add("on"); };

/* ---------- الباركود ---------- */
function hash(s) {
  let x = 2166136261;
  for (const c of s) { x ^= c.charCodeAt(0); x = Math.imul(x, 16777619) >>> 0; }
  return x.toString(36).toUpperCase().padStart(4, "0").slice(-4);
}
function toB64(name) {
  let bin = ""; new TextEncoder().encode(name).forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
const makeCode = name => { const b = toB64(name); return "INV." + b + "." + hash(b + SECRET); };

/* ---------- حركات الخلفية ---------- */
if (!still) {
  const em = ["🎈", "✨", "🎉", "🎊", "⭐", "💛"];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("span");
    s.textContent = em[i % em.length];
    s.style.cssText = `left:${Math.random() * 96}%;font-size:${18 + Math.random() * 26}px;animation-duration:${9 + Math.random() * 10}s;animation-delay:-${Math.random() * 16}s`;
    $("bg").appendChild(s);
  }
}

/* ---------- قصاصات ملوّنة ---------- */
function confetti() {
  if (still) return;
  const c = $("cf"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e0452f", "#f0b429", "#1f7a4d", "#3b82c4", "#c2409a"];
  const ps = Array.from({ length: 130 }, () => ({
    x: c.width / 2, y: c.height * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    col: cols[(Math.random() * cols.length) | 0]
  }));
  const t0 = performance.now();
  (function tick(t) {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.col; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
    });
    if (t - t0 < 3200) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
  })(t0);
}

/* ---------- رسالة الترحيب (ذكاء اصطناعي مع بديل جاهز) ---------- */
const fallback = n => [
  `يسعدنا أن تكون معنا يا ${n}، فحضورك يزيّن الحفل!`,
  `أهلًا بك يا ${n}، ننتظرك بابتسامة وفرحة كبيرة 🎉`,
  `وجودك يا ${n} يجعل حفلنا أجمل، نراك قريبًا!`
][(Math.random() * 3) | 0];

async function aiWelcome(name) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 9000);
  try {
    const r = await fetch("/api/welcome", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name }), signal: ctl.signal });
    if (!r.ok) throw 0;
    const m = (await r.json()).message;
    if (!m) throw 0;
    return { text: m, ai: true };
  } catch (e) { return { text: fallback(name.split(" ")[0]), ai: false }; }
  finally { clearTimeout(to); }
}
function typeInto(el, text, ai) {
  el.classList.remove("load"); el.textContent = "";
  const tag = ai ? `<small>✨ رسالة مخصصة بالذكاء الاصطناعي</small>` : "";
  if (still) { el.textContent = text; el.insertAdjacentHTML("beforeend", tag); return; }
  let i = 0;
  const t = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(t); el.insertAdjacentHTML("beforeend", tag); }
  }, 38);
}

/* ---------- التنقل ---------- */
let current = "", currentName = "";
$("yes").onclick = () => { confetti(); show("p2"); setTimeout(() => $("nm").focus(), 400); };
$("no").onclick = () => show("pNo");
$("back").onclick = () => show("p1");

function submitName() {
  const name = $("nm").value.trim().replace(/\s+/g, " ");
  if (name.split(" ").length < 3) {
    const e = $("err"); e.textContent = "الرجاء كتابة الاسم الثلاثي كاملًا (ثلاث كلمات).";
    e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake"); return;
  }
  $("err").textContent = "";
  currentName = name; current = makeCode(name);
  $("shown").textContent = name;
  JsBarcode("#bc", current, { format: "CODE128", width: 1.6, height: 90, displayValue: false, margin: 10, background: "#ffffff" });
  $("ai").className = "ai load"; $("ai").textContent = ".";
  $("tk").classList.remove("go");
  show("p3");
  setTimeout(() => { $("tk").classList.add("go"); confetti(); }, 1200);
  aiWelcome(name).then(r => typeInto($("ai"), r.text, r.ai));
}
$("ok").onclick = submitName;
$("nm").addEventListener("keydown", e => { if (e.key === "Enter") submitName(); });

/* ---------- حفظ كصورة ---------- */
$("dl").onclick = () => {
  const svg = $("bc"), w = svg.viewBox.baseVal.width, h = svg.viewBox.baseVal.height, img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = Math.max(w, 360) + 40; c.height = h + 130;
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = "#2b1d12"; x.textAlign = "center";
    x.font = "bold 26px Tahoma,Arial"; x.fillText("نتشرف بحضورك", c.width / 2, 40);
    x.font = "bold 30px Tahoma,Arial"; x.fillText(currentName, c.width / 2, 85);
    x.drawImage(img, (c.width - w) / 2, 110, w, h);
    const a = document.createElement("a"); a.download = "invitation-barcode.png"; a.href = c.toDataURL("image/png"); a.click();
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
};
</script>
</body>
</html>
